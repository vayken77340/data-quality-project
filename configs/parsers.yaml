# Per-format parser defaults. Top-level keys must match a registered
# parser name (see src/data_contract/data_parsers/); each block's keys
# must match that parser's PARSER_PARAMS allowlist. Both are validated
# at load time.
#
# This is the sole source of per-format default values. Per-validation
# and per-table overrides go in each epic's validation.yaml under
# defaults.parser_overrides: / tables.<T>.parser_overrides: -- those win
# over the defaults declared here.
#
# Adding a new parser? Drop a module under data_parsers/, then add a
# block here with its defaults.

csv:
  encoding:    utf-8
  delimiter:   ","
  header_row:  1
  null_tokens: ["", "NULL"]
  quote_char:  '"'

excel:
  header_row:  1
  null_tokens: ["", "NULL"]

# Self-describing JSON: each file carries its own column code -> name map
# under `report_header`, and the data rows live in `report_row`. The
# parser uses `report_header[<code>][name_key]` to rename the row keys to
# the contract field names. Override `header_path` / `rows_path` to point
# at a different JSON-export shape.
json:
  encoding:    utf-8
  header_path: "data.report_header"
  rows_path:   "data.report_row"
  name_key:    "name"
  null_tokens: ["", "null", "NULL"]
