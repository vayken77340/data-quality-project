# Global spec-parsing configuration.
#
# Per-column policy:
#   * Every column is value-required by default. A blank cell in a non-empty
#     data row produces a `missing_mandatory` rejection.
#   * Declare `default_value` (any YAML value, including `null`) to opt the
#     column out of "required". Blank cells are then silently replaced with
#     that default.
#       - `default_value: null`  -> blank yields Python None; the field
#                                   omits the corresponding key in the
#                                   generated contract.
#       - `default_value: ""`    -> blank yields the empty string; the
#                                   field's key is emitted with `""`.
#       - `default_value: 0`     -> blank yields 0. (Or any literal.)
#   * `column_required: false` REQUIRES `default_value` to be declared,
#     because every row in a missing column would otherwise error.

fields:
  column_mapping:
    name:
      spec_name: Champ dans extract
    # Optional override: when present, this cell becomes the contract field's
    # `name` verbatim. Blank cells fall back to slugifying the source name.
    # Use it for acronyms ("URL" -> `url` not `u_r_l`), reserved words, and
    # team-specific conventions the auto-slug can't infer.
    db_name:
      spec_name: Nom BDD
      column_required: false
      default_value: null
    type:
      spec_name: Type
    description:
      spec_name: Description
      column_required: false
      default_value: ""
    table:
      spec_name: Table
      column_required: false
      default_value: null
    nullable:
      spec_name: Obligatoire
      values:
        "true":  ["non"]
        "false": ["oui"]

keys:
  sheet_name: "Clés unitaires"
  column_mapping:
    table_name:
      spec_name: "Table"
    primary_key:
      spec_name: "Clé primaire"
      separator: "&"
    foreign_key:
      spec_name: "Clé étrangère"
      separator: ","
      default_value: null
    comments:
      spec_name: "Commentaires"
      column_required: false
      default_value: ""

joins:
  sheet_name: "Clés de jointure"
  column_mapping:
    source_table:
      spec_name: "Table Source"
    target_table:
      spec_name: "Table Cible"
    source_column:
      spec_name: "Clé Jointure Source"
    target_column:
      spec_name: "Clé Jointure Cible"
    join_type:
      spec_name: "Type de Jointure"
    cardinality:
      spec_name: "Cardinalité"
      default_value: null
    comment:
      spec_name: "Commentaire"
      column_required: false
      default_value: ""
    description:
      spec_name: "Description / règle métier"
      column_required: false
      default_value: ""
