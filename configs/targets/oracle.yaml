name: oracle
description: Oracle 19c+ (NUMBER(38), VARCHAR2 byte-counted, no native boolean)

overrides:
  string:
    physical_type: "VARCHAR2({max_length} BYTE)"
    length_unit: bytes              # VARCHAR2(n BYTE) is the Oracle default

  text:
    physical_type: "CLOB"            # unbounded variable-length string

  int32:
    physical_type: "NUMBER(10, 0)"
    bounds: { min: -2147483648, max: 2147483647 }

  int64:
    physical_type: "NUMBER(19, 0)"
    # NUMBER(19) actually holds up to 10^19 - 1, slightly wider than IEEE
    # int64. Capped at the IEEE range so values fit Polars's pl.Int64 storage
    # used by the validator's frame; spec authors wanting wider use decimal.
    bounds: { min: -9223372036854775808, max: 9223372036854775807 }

  float32:
    physical_type: "BINARY_FLOAT"
    bounds: { min: -3.4028234663852886e38, max: 3.4028234663852886e38 }   # IEEE 754

  float64:
    physical_type: "BINARY_DOUBLE"
    bounds: { min: -1.7976931348623157e308, max: 1.7976931348623157e308 }  # IEEE 754

  decimal:
    physical_type: "NUMBER({precision}, {scale})"
    max_precision: 38

  boolean:
    physical_type: "CHAR(1)"        # Oracle has no native BOOLEAN; CHAR(1) Y/N convention
    # Accepted boolean tokens are no longer target-controlled; they live on
    # each BOOLEAN field in the generated contract (stamped from
    # configs/types.yaml at generation time).

  date:
    physical_type: "DATE"
    # Includes "%Y-%m-%d %H:%M" so cells exported with a zero time component
    # (e.g. "2024-01-15 00:00") still parse as DATE; the time is discarded.
    parse_formats: ["%Y-%m-%d", "%d/%m/%Y", "%d-%b-%Y", "%Y-%m-%d %H:%M"]

  timestamp:
    physical_type: "TIMESTAMP"
    parse_formats: ["%Y-%m-%d %H:%M:%S", "%d-%b-%Y %H:%M:%S", "%Y-%m-%d %H:%M"]

  timestamp_tz:
    physical_type: "TIMESTAMP WITH TIME ZONE"

  binary:
    physical_type: "BLOB"
