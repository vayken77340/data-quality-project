mappings:
  string:
    aliases: [string, varchar, varchar2, char, texte, str]
    parameter: max_length

  text:
    # Variable-length / unbounded string. Spec authors who don't know or don't
    # care about a max length use this; targets map it to their unbounded
    # variant (Postgres TEXT, Oracle CLOB, Iceberg string). No max_length.
    aliases: [text, clob, longtext, longvarchar, "texte long"]

  int32:
    aliases: [int32, smallint, int4]

  int64:
    aliases: [int64, integer, int, bigint, long, int8, entier]
    # Legacy `integer` and bare `int` go to int64 (safer than int32; matches Oracle's NUMBER(38)).

  float32:
    aliases: [float32, float, real, "réel"]

  float64:
    aliases: [float64, double, "double precision"]

  decimal:
    aliases: [decimal, numeric, number]
    parameters: [precision, scale]

  boolean:
    aliases: [boolean, bool, "booléen"]
    data_values:
      "true":  [true,  "true",  "vrai", "oui", "yes", "y", "t", "on",  "1"]
      "false": [false, "false", "faux", "non", "no",  "n", "f", "off", "0"]

  date:
    aliases: [date]
    # Accept "%Y-%m-%d %H:%M" so source data exported as "2024-01-15 00:00"
    # (date-only Excel cells re-exported with a zero time component) parses
    # cleanly into a DATE column. The time component is discarded.
    parse_formats: ["%Y-%m-%d", "%d/%m/%Y", "%Y-%m-%d %H:%M"]

  timestamp:
    aliases: [timestamp, datetime, "date horodatée", "Date / heure"]
    parse_formats:
      - "%Y-%m-%d %H:%M:%S"
      - "%Y-%m-%dT%H:%M:%S"
      - "%d/%m/%Y %H:%M"
      - "%Y-%m-%d %H:%M"             # without seconds

  timestamp_tz:
    aliases: [timestamp_tz, timestamptz, "timestamp with time zone"]
    parse_formats: ["%Y-%m-%dT%H:%M:%S%z", "%Y-%m-%d %H:%M:%S%z"]

  binary:
    aliases: [binary, blob, bytea, varbinary]
