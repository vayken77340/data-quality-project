mappings:
  - canonical: varchar
    aliases: [varchar, char, string, texte, text]
    parameter: max_length
  - canonical: integer
    aliases: [int, integer, bigint, smallint, entier]
  - canonical: double
    aliases: [double, numeric, "réel", real, decimal, number]
  - canonical: float
    aliases: [float]
    parameter: precision
  - canonical: boolean
    aliases: ["booléen", boolean, bool]
  - canonical: date
    aliases: [date]
  - canonical: timestamp
    aliases: ["date horodatée", timestamp, datetime]
