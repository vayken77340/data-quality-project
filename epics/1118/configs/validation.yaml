# REQUIRED: target database. Universal logical types in the contract acquire
# concrete validation rules (bounds, length_unit, boolean tokens, physical_type)
# only when mapped to a target's physical types. Switch to `oracle` or
# `iceberg` to validate against those databases' rules.
target: oracle

# Defaults shared across tables.
#
# `file_pattern` is a glob applied relative to the epic's directory
# (epics/<epic>/). So "sample/{table}*.xlsx" walks epic_dir/sample/, looking
# for files like PROJECT.xlsx, CALENDAR.xlsx, etc.
#
# `{table}` is substituted with the table name at glob time.
defaults:
  format: excel
  file_pattern: "sample/{table}*.xlsx"

# Required: every check has an explicit on/off flag. Descriptions live
# globally in configs/report_strings.yaml under `checks_sheet.descriptions`
# (they describe the check itself, not the epic, so they don't belong here).
checks:
  # Structural / per-field core
  type_coercion: true
  boolean_coercion: true
  nullable: true
  max_length: true
  column_missing: true
  # Keys
  pk_uniqueness: true
  fk_existence: false
  # Per-constraint (FieldConstraint registry names)
  allowed_values: false
  pattern: false
  min_value: false
  max_value: false
  format: false
  unique: false

# `contracts_folder` is optional; omitted = <epic_dir>/contracts.
# contracts_folder: "epics/1118/contracts"

# `tables:` is optional. Omitted = every <table>.yaml under contracts_folder is validated.
# Listing scopes validation to a subset and lets you override defaults per table.
#
# tables:
#   PROJECT:
#   CALENDAR:
#     parser_overrides:
#       sheet_name: "Calendar Sheet"   # format-specific config goes here
#     field_mapping:
#       "Data Header": contract_field  # per-table column rename
