# REQUIRED: target database. Universal logical types in the contract acquire
# concrete validation rules (bounds, length_unit, boolean tokens, physical_type)
# only when mapped to a target's physical types. Switch to `oracle` or
# `iceberg` to validate against those databases' rules.
target: oracle

# Defaults shared across tables.
#
# `file_pattern` is a glob applied relative to the epic's directory
# (epics/<epic>/). So "sample/{table}*.xlsx" walks epic_dir/sample/, looking
# for files like PROJECT.xlsx, CALENDAR.xlsx, etc.
#
# `{table}` is substituted with the table name at glob time.
defaults:
  format: excel
  file_pattern: "sample/{table}*.xlsx"

# Tier-keyed checks block. Every name within a tier must be listed
# explicitly (true|false). Descriptions live in
# configs/report_strings.yaml under `checks_sheet.descriptions`.
#
# Tiers:
#   structural -- type-system-derived (hard-coded set; new structural
#                 checks are added by introducing a new Type in
#                 configs/types.yaml, not by registering a new check).
#   table      -- table_checks/ registry. Pluggable: drop a TableCheck
#                 subclass in src/data_contract/table_checks/.
#   field      -- field_constraints/ registry. Pluggable: drop a
#                 FieldConstraint subclass in src/data_contract/field_constraints/.
checks:
  structural:
    type_coercion: true
    boolean_coercion: true
    nullable: true
    max_length: true
    # Source-schema drift checks (default off). Flip on to compare
    # parser-discovered column names / types against the contract.
    # `field_names_from_sample` skips silently for parsers that don't expose
    # column names; `field_types_from_sample` skips silently for parsers
    # without type info (e.g. CSV).
    field_names_from_sample: false
    field_types_from_sample: false
  table:
    column_missing: true
    pk_uniqueness: true
    fk_existence: false
  field:
    allowed_values: false
    pattern: false
    min_value: false
    max_value: false
    format: false
    unique: false

# Tier-keyed metrics block. `field` metrics emit one value per contract
# field; `table` metrics emit a single scalar per table. Devs can drop a
# new TableMetric subclass into src/data_contract/metrics/ and it will be
# required here at load time.
metrics:
  field:
    null_count: true
    null_percentage: true
    distinct_count: true
    completeness: true
    duplicate_pct: true
  table:
    row_count: true

# `contracts_folder` is optional; omitted = <epic_dir>/contracts.
# contracts_folder: "epics/1118/contracts"

# `tables:` is optional. Omitted = every <table>.yaml under contracts_folder is validated.
# Listing scopes validation to a subset and lets you override defaults per table.
#
# tables:
#   PROJECT:
#   CALENDAR:
#     parser_overrides:
#       sheet_name: "Calendar Sheet"   # format-specific config goes here
#     field_mapping:
#       "Data Header": contract_field  # per-table column rename
