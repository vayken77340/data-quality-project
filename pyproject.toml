[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "data-contract"
version = "0.1.0"
description = "Spec-driven data contract generator plus medallion warehouse validator (Trino, Oracle)."
requires-python = ">=3.11"
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
    "jsonschema>=4.0",
]

[project.optional-dependencies]
validate-data = [
    "polars>=1.0",
    "pyarrow>=15.0",
    "python-calamine>=0.2",
    "Jinja2>=3.1",
]
validate-warehouse = [
    "trino>=0.330",
]
validate-warehouse-oracle = [
    "oracledb>=2.0",
]

[project.scripts]
data-contract = "data_contract.cli:main"
warehouse-validation = "warehouse_validation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
